server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite de subida alineado con MAX_CONTENT_LENGTH del backend (51 MiB)
    client_max_body_size 51m;

    # La API se sirve en el MISMO origen que el frontend (mismo host/puerto/protocolo).
    # Así el navegador nunca llama a una IP o puerto distinto (localhost:5000, 192.168.x.x:5000),
    # lo que evita bloqueos por CORS, contenido mixto (HTTPS -> HTTP) y puertos no expuestos
    # cuando se accede mediante el nombre DNS.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Necesario para Vue Router en modo history
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
